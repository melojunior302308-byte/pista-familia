<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B03925">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>Pista da Família Lessa Melo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface-2:#F6F8F6; --ink:#13201A; --muted:#56675D; --line:#D3DCD6;
  --tartan:#B03925; --tartan-2:#8E2B1A; --on-tartan:#FFFFFF; --infield:#2E7A55; --infield-2:#276B4A; --lane:#FFFFFF;
  --gold:#C4870E;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#0F1713; --surface:#17221C; --surface-2:#1D2A23; --ink:#E8EFEA; --muted:#95A89C; --line:#2A3A31;
    --tartan:#D04C34; --tartan-2:#A63A26; --on-tartan:#FFFFFF; --infield:#3C9468; --infield-2:#2F7A55; --lane:#F2F5F3;
    --gold:#E3A631;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1713; --surface:#17221C; --surface-2:#1D2A23; --ink:#E8EFEA; --muted:#95A89C; --line:#2A3A31;
  --tartan:#D04C34; --tartan-2:#A63A26; --on-tartan:#FFFFFF; --infield:#3C9468; --infield-2:#2F7A55; --lane:#F2F5F3;
  --gold:#E3A631;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg)}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.wrap{max-width:560px; margin:0 auto; padding:16px 16px 110px}
.num{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-variant-numeric:tabular-nums}

header.top{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:4px 2px 14px}
header.top h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:30px; line-height:1; margin:0; letter-spacing:.2px}
header.top .date{color:var(--muted); font-size:15px}

/* runners */
.runners{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; margin:0 -2px; scrollbar-width:none}
.runners::-webkit-scrollbar{display:none}
.chip{flex:none; display:flex; align-items:center; gap:8px; border:1.5px solid var(--line); background:var(--surface);
  border-radius:999px; padding:7px 14px 7px 8px; font-weight:600; font-size:15px}
.chip .dot{width:22px; height:22px; border-radius:50%; background:var(--c); display:grid; place-items:center;
  color:#fff; font-size:12px; font-weight:700}
.chip[aria-pressed="true"]{border-color:var(--c); box-shadow:inset 0 0 0 1.5px var(--c)}
.chip.add{padding:7px 14px; color:var(--muted); border-style:dashed}

/* segmented */
.seg{display:grid; grid-template-columns:repeat(var(--n,2),1fr); background:var(--surface-2); border:1px solid var(--line); border-radius:12px; padding:4px; gap:4px}
.seg button{border:0; background:transparent; border-radius:9px; padding:9px 8px; font-weight:600; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* stadium / scoreboard */
.stadium{margin-top:14px; background:var(--surface); border:1px solid var(--line); border-radius:22px; overflow:hidden}
.trackbox{background:var(--infield); padding:14px 12px 6px; position:relative}
.trackbox svg{display:block; width:100%; height:auto}
.board{padding:10px 18px 18px; text-align:center}
.who{color:var(--muted); font-size:15px; min-height:22px}
.who b{color:var(--ink)}
.clock{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-variant-numeric:tabular-nums; font-weight:700;
  font-size:clamp(68px,24vw,124px); line-height:.95; letter-spacing:-1px; margin:4px 0 2px}
.clock .cs{font-size:.5em; color:var(--muted); letter-spacing:0}
.sub{color:var(--muted); font-size:15px; min-height:22px}
.sub .pb{color:var(--gold); font-weight:600}
.controls{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px}
.controls.one{grid-template-columns:1fr}
.btn{border:0; border-radius:16px; padding:17px 12px; font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700;
  font-size:24px; letter-spacing:.3px; transition:transform .08s ease}
.btn:active{transform:scale(.97)}
.btn.go{background:var(--infield); color:#fff}
.btn.stop{background:var(--tartan); color:var(--on-tartan)}
.btn.lap{background:var(--ink); color:var(--bg)}
.btn.ghost{background:var(--surface-2); color:var(--ink); border:1px solid var(--line)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.linkish{background:none; border:0; color:var(--muted); text-decoration:underline; text-underline-offset:3px; padding:10px 4px; font-size:15px}

/* lap ticker */
.ticker{display:flex; gap:6px; flex-wrap:wrap; justify-content:center; margin-top:12px}
.ticker span{background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:3px 9px; font-size:17px}
.ticker span.best{border-color:var(--gold); color:var(--gold)}

/* sections */
section h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:24px; margin:26px 2px 10px; line-height:1.1}
.card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:6px 0}
.row{display:flex; align-items:center; gap:12px; padding:10px 14px}
.row + .row{border-top:1px solid var(--line)}
.row .dot{width:10px; height:10px; border-radius:50%; background:var(--c); flex:none}
.row .main{flex:1; min-width:0}
.row .t{font-size:22px; font-weight:600}
.row .m{color:var(--muted); font-size:14px}
.row .x{border:0; background:transparent; color:var(--muted); width:36px; height:36px; border-radius:10px; font-size:20px; flex:none}
.row .x:hover{background:var(--surface-2)}
.tag{display:inline-block; font-size:13px; font-weight:600; border-radius:6px; padding:1px 7px; background:var(--surface-2); border:1px solid var(--line); margin-left:6px; vertical-align:2px}
.tag.pb{border-color:var(--gold); color:var(--gold)}
.empty{color:var(--muted); padding:18px 16px; text-align:center}

.person{margin-bottom:12px}
.person-head{display:flex; align-items:center; gap:10px; padding:12px 14px 4px}
.person-head .dot{width:14px; height:14px; border-radius:50%; background:var(--c); flex:none}
.person-head strong{font-size:17px}
.person-head .m{margin-left:auto; color:var(--muted); font-size:14px}

/* stats */
.stats{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:12px 14px}
.stat .v{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-variant-numeric:tabular-nums; font-weight:700; font-size:34px; line-height:1}
.stat .l{color:var(--muted); font-size:14px; margin-top:4px}
.chart{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 10px 8px; margin-top:10px}
.chart svg{display:block; width:100%; height:auto}
.chart .cap{color:var(--muted); font-size:14px; padding:0 6px 6px}

/* forms */
.field{display:flex; flex-direction:column; gap:6px; margin-bottom:12px}
.field label{font-size:14px; color:var(--muted); font-weight:600}
.input{border:1.5px solid var(--line); background:var(--surface); border-radius:12px; padding:12px 14px; width:100%; font-size:17px}
.input:focus{border-color:var(--infield); outline:none}
.inline{display:flex; gap:8px}
.inline .input{flex:1}
.swatches{display:flex; gap:10px; flex-wrap:wrap}
.sw{width:34px; height:34px; border-radius:50%; border:3px solid transparent; background:var(--c); padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink)}

/* bottom nav */
nav.tabs{position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--surface); border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0; background:transparent; padding:10px 4px 12px; display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--muted); font-size:13px; font-weight:600}
nav.tabs button svg{width:24px; height:24px}
nav.tabs button[aria-current="page"]{color:var(--tartan)}

/* sheet */
.scrim{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:30; display:none; align-items:flex-end; justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--bg); width:100%; max-width:560px; border-radius:22px 22px 0 0; padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));
  max-height:90vh; overflow:auto; animation:up .22s ease}
@keyframes up{from{transform:translateY(30px); opacity:0}to{transform:none; opacity:1}}
.sheet h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-size:26px; margin:0 0 14px}

.toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:40;
  background:var(--ink); color:var(--bg); border-radius:14px; padding:10px 10px 10px 16px; display:none; align-items:center; gap:12px;
  max-width:calc(100% - 32px); box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.show{display:flex}
.toast button{border:0; background:transparent; color:var(--gold); font-weight:700; padding:6px 8px}
.hidden{display:none !important}
.dists{margin-top:8px}
.goal{margin-top:14px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px 16px}
.goal .top{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.goal .big{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:26px; font-variant-numeric:tabular-nums}
.goal .m{color:var(--muted); font-size:14px}
.bar{height:12px; border-radius:999px; background:var(--surface-2); border:1px solid var(--line); overflow:hidden; margin-top:8px}
.bar i{display:block; height:100%; background:var(--c,var(--infield)); border-radius:999px; transition:width .4s ease}
.bar.done i{background:var(--gold)}
.mini-bar{height:6px; margin-top:6px}
.countdown{position:fixed; inset:0; z-index:50; background:var(--tartan); color:#fff; display:none; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px}
.countdown.open{display:flex}
.countdown .cd{font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:clamp(56px,16vw,120px); line-height:1}
.countdown .cdwho{font-size:20px; opacity:.85; margin-bottom:10px}
.countdown.go{background:var(--infield)}
.countdown button{margin-top:40px; background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:12px; padding:12px 22px; font-weight:600}
.toggle{display:flex; align-items:center; justify-content:space-between; gap:12px}
.toggle input{width:24px; height:24px; accent-color:var(--infield); flex:none}
:root[data-theme="cream"]{--bg:#F3EDE1; --surface:#FBF7EF; --surface-2:#ECE4D4; --ink:#2A241C; --muted:#6E6556; --line:#DDD3C2; color-scheme:light}
:root[data-theme="gray"]{--bg:#D9DEE3; --surface:#F1F3F5; --surface-2:#E2E6EA; --ink:#1D232A; --muted:#56606A; --line:#C3CAD1; color-scheme:light}
:root[data-theme="dark"]{--bg:#141517; --surface:#1E2023; --surface-2:#282B2F; --ink:#ECEDEE; --muted:#9DA2A8; --line:#34383D; --tartan:#D04C34; --tartan-2:#A63A26; --infield:#3C9468; --infield-2:#2F7A55; --lane:#F2F5F3; --gold:#E3A631; color-scheme:dark}
header.top{position:relative}
.hdr-r{display:flex; align-items:center; gap:10px}
.pal{width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; color:var(--ink); flex:none; padding:0}
.pal svg{width:22px; height:22px}
.pal[aria-expanded="true"]{border-color:var(--tartan)}
.pal-menu{position:absolute; right:0; top:calc(100% + 8px); z-index:25; width:min(320px,calc(100vw - 32px)); background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:12px; box-shadow:0 12px 36px rgba(0,0,0,.18)}
.pm-h{font-weight:600; color:var(--muted); font-size:14px; margin:4px 6px 8px}
.th{display:flex; align-items:center; gap:12px; width:100%; border:0; background:transparent; border-radius:12px; padding:7px 8px; text-align:left; font-size:17px}
.th + .th{margin-top:2px}
.th[aria-pressed="true"]{background:var(--surface-2); font-weight:600}
.th .pv{width:56px; height:36px; border-radius:8px; border:1px solid var(--line); display:grid; place-items:center; flex:none}
.th .pv span{background:var(--pvs); color:var(--pvi); font-size:12px; font-weight:700; border-radius:5px; padding:3px 7px}
.th .ck{margin-left:auto; font-size:18px}
.pal-menu hr{border:0; border-top:1px solid var(--line); margin:10px 0}
.sizes{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.sz{border:1px solid var(--line); background:var(--surface); border-radius:12px; padding:8px 4px; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--muted); font-size:13px}
.sz b{color:var(--ink); font-family:"Barlow Condensed","Arial Narrow",sans-serif; line-height:1.1}
.sz[aria-pressed="true"]{background:var(--surface-2); border-color:var(--infield)}
.pal-menu summary{cursor:pointer; color:var(--muted); padding:4px 6px}
.pal-menu .swatches{padding:10px 6px 4px}
.pm-note{color:var(--muted); font-size:13px; margin:10px 6px 2px}
.chip.grp{padding:7px 14px}
.chip.grp[aria-pressed="true"]{border-color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--ink); background:var(--surface-2)}
.gctl{display:grid; gap:10px; margin-top:16px}
.gbtn{display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; border:0; border-radius:16px; padding:14px 16px; background:var(--c); color:#fff;
  font-family:"Barlow Condensed","Arial Narrow",sans-serif; font-weight:700; font-size:26px; text-align:left; line-height:1.1; transition:transform .08s ease}
.gbtn:active{transform:scale(.98)}
.gbtn small{display:block; font-family:"Barlow",system-ui,sans-serif; font-weight:600; font-size:14px; opacity:.9}
.gbtn .gt{font-variant-numeric:tabular-nums; font-size:28px; flex:none}
.gbtn.done{background:var(--surface-2); color:var(--ink); box-shadow:inset 0 0 0 2px var(--c); cursor:default}
.grow{display:grid; grid-template-columns:1fr auto; gap:8px}
.gfin{border:1px solid var(--line); background:var(--surface-2); border-radius:14px; padding:0 14px; font-weight:600; font-size:14px; color:var(--muted)}
.sync{font-size:13px; color:var(--muted); text-align:center; margin-top:22px}
@media (prefers-reduced-motion: reduce){ .sheet{animation:none} .btn{transition:none} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1 style="display:flex;align-items:center;gap:10px"><img src="icon.svg" alt="" width="44" height="44" style="border-radius:11px;flex:none">Pista da Família Lessa Melo</h1>
    <div class="hdr-r">
      <span class="date" id="today"></span>
      <button class="pal" id="palBtn" aria-label="Aparência" aria-expanded="false" aria-controls="palMenu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.9 1.8-1.9 0-.5-.2-.9-.5-1.3-.3-.3-.5-.8-.5-1.3 0-1 .8-1.8 1.8-1.8H17a4 4 0 0 0 4-4C21 6.5 17 3 12 3z"/><circle cx="7.5" cy="11" r="1" fill="currentColor"/><circle cx="10" cy="7" r="1" fill="currentColor"/><circle cx="14.5" cy="7" r="1" fill="currentColor"/><circle cx="17" cy="10.5" r="1" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="pal-menu hidden" id="palMenu" role="dialog" aria-label="Aparência">
      <div class="pm-h">Tema</div>
      <div id="themeList"></div>
      <hr>
      <div class="pm-h">Tamanho da letra</div>
      <div class="sizes" id="sizeList"></div>
      <hr>
      <details><summary>Mais cores (destaque e menu)</summary><div class="swatches" id="accList"></div></details>
      <p class="pm-note">Vale só neste aparelho.</p>
    </div>
  </header>

  <!-- TREINAR -->
  <main id="view-train">
    <div class="runners" id="runners"></div>
    <div class="seg" role="group" aria-label="Tipo de treino">
      <button id="mSprint" aria-pressed="true">Tiros</button>
      <button id="mlap" aria-pressed="false">Voltas</button>
    </div>
    <div class="seg dists" id="dists" style="--n:3" role="group" aria-label="Distância do tiro">
      <button data-d="50">50 m</button><button data-d="100">100 m</button><button data-d="200">200 m</button>
    </div>

    <div class="stadium">
      <div class="trackbox">
        <svg viewBox="0 0 320 172" aria-hidden="true">
          <path id="trk" d="M 90,150 H 230 A 65 65 0 0 0 230,20 H 90 A 65 65 0 0 0 90,150 Z" fill="none"/>
          <use href="#trk" stroke="var(--lane)" stroke-width="28"/>
          <use href="#trk" stroke="var(--tartan)" stroke-width="26"/>
          <use href="#trk" stroke="var(--lane)" stroke-width="9" opacity=".85"/>
          <use href="#trk" stroke="var(--tartan)" stroke-width="7.6"/>
          <path id="straight" d="M 90,150 H 230" stroke="var(--gold)" stroke-width="26" opacity=".28"/>
          <line id="startLine" x1="90" y1="136" x2="90" y2="164" stroke="var(--lane)" stroke-width="2" stroke-dasharray="3 2"/>
          <line x1="230" y1="136" x2="230" y2="164" stroke="var(--lane)" stroke-width="3"/>
          <text x="160" y="92" text-anchor="middle" fill="#fff" opacity=".9" font-family="Barlow Condensed, Arial Narrow, sans-serif" font-weight="700" font-size="26" id="trackLabel">100 m</text>
          <g id="gdots"></g>
          <circle id="runnerDot" cx="90" cy="150" r="8" fill="#fff" stroke="var(--ink)" stroke-width="2.5"/>
        </svg>
      </div>
      <div class="board">
        <div class="who" id="who"></div>
        <div class="clock" id="clock" aria-live="off">0<span class="cs">,00</span></div>
        <div class="sub" id="sub"></div>
        <div class="controls" id="controls"></div>
        <div class="ticker" id="ticker"></div>
        <button class="linkish" id="manualBtn">Lançar tempo à mão</button>
      </div>
    </div>

    <div id="goal"></div>
    <section>
      <h2>Hoje</h2>
      <div id="todayList"></div>
    </section>
  </main>

  <!-- HISTÓRICO -->
  <main id="view-history" class="hidden">
    <div class="runners" id="hRunners"></div>
    <div class="seg" style="--n:4" role="group" aria-label="Tipo de treino" id="hSeg">
      <button data-h="50">50 m</button><button data-h="100">100 m</button><button data-h="200">200 m</button><button data-h="volta">Voltas</button>
    </div>
    <section>
      <h2>Recordes</h2>
      <div class="stats" id="stats"></div>
      <div class="chart" id="chart"></div>
    </section>
    <section>
      <h2>Dia a dia</h2>
      <div id="days"></div>
    </section>
  </main>

  <!-- FAMÍLIA -->
  <main id="view-family" class="hidden">
    <section>
      <h2 style="margin-top:6px">Quem corre</h2>
      <div class="card" id="famList"></div>
      <div style="margin-top:12px"><button class="btn ghost" style="width:100%" id="addRunner2">Adicionar pessoa</button></div>
    </section>
    <section>
      <h2>Pista</h2>
      <div class="card" style="padding:14px">
        <div class="field" style="margin:0">
          <label for="lapSize">Tamanho de uma volta (metros)</label>
          <input class="input num" id="lapSize" type="number" min="100" max="1000" step="10" inputmode="numeric">
        </div>
      </div>
      <div class="card" style="padding:14px; margin-top:10px">
        <label class="toggle" for="cdOn"><span><b>Largada com contagem e som</b><br><span style="color:var(--muted);font-size:14px">“Às suas marcas… Prontos… Já!” antes de começar a cronometrar</span></span><input type="checkbox" id="cdOn"></label>
      </div>
      <div class="card" style="padding:14px; margin-top:10px">
        <b>Backup</b>
        <div style="color:var(--muted);font-size:14px;margin:2px 0 10px">Baixe um arquivo com todos os treinos para guardar ou levar para outro aparelho.</div>
        <div class="controls" style="margin-top:0"><button class="btn ghost" id="bkExp" style="font-size:20px;padding:12px">Exportar</button><button class="btn ghost" id="bkImp" style="font-size:20px;padding:12px">Importar</button></div>
        <input type="file" id="bkFile" accept="application/json,.json" class="hidden">
      </div>
    </section>
    <p class="sync" id="sync"></p>
  </main>
</div>

<nav class="tabs">
  <div class="in">
    <button data-tab="train" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2h5M12 2v3"/></svg>Treinar</button>
    <button data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Histórico</button>
    <button data-tab="family">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9.5" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 14.6c.6-.2 1.3-.3 2-.3 2.8 0 4.5 2 4.5 4.7"/></svg>Família</button>
  </div>
</nav>

<div class="scrim" id="scrim"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="countdown" id="countdown" role="alertdialog" aria-live="assertive"><div class="cdwho" id="cdWho"></div><div class="cd" id="cdText"></div><button id="cdCancel">Cancelar</button></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastUndo">Desfazer</button></div>

<script>
(function(){
"use strict";
const COLORS=["#C23B22","#2E7A55","#2F5FA8","#F2C200","#C4870E","#7A4BA8","#1F8A8A","#D0457E","#5A6B2E"];
const KEY="pista-familia-v1";
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,"0");
const dayKey=(d=new Date())=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- estado ---------- */
// S.runners: [{id,name,color}], S.lapM: metros, S.days: {"AAAA-MM-DD": [{id,r,k:"100"|"volta",ms,at}]}
let S={runners:[],lapM:400,days:{},u:0,cd:true};
let ui={tab:"train",runner:null,mode:"100",sprint:"100",hRunner:null,hMode:"100",group:false,sel:[]};
const isSprint=()=>ui.mode!=="volta";
const metersOf=k=>k==="volta"?S.lapM:Number(k);
const kLabel=k=>k==="volta"?"Volta":"Tiro de "+k+" m";
const REF={"50":9000,"100":16000,"200":34000};

function loadLocal(){
  try{const raw=localStorage.getItem(KEY); if(raw){const o=JSON.parse(raw); if(o&&o.days) S=Object.assign(S,o);}}catch(e){}
}
function saveLocal(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }

/* ---------- nuvem (db) ---------- */
let col=null, writing=false; const dirty=new Set();
function markDirty(what){ S.u=Date.now(); dirty.add(what); saveLocal(); flush(); }
async function flush(){
  if(!col||writing) return;
  writing=true;
  try{
    while(dirty.size){
      const k=dirty.values().next().value; dirty.delete(k);
      try{
        if(k==="meta") await col.doc("meta").set({json:JSON.stringify({runners:S.runners,lapM:S.lapM,cd:S.cd,u:S.u})});
        else{
          const list=S.days[k];
          if(list&&list.length) await col.doc("d-"+k).set({json:JSON.stringify(list)});
          else await col.doc("d-"+k).delete();
        }
      }catch(e){ setSync("Salvo neste aparelho. A cópia na nuvem será atualizada na próxima mudança."); }
    }
  } finally { writing=false; }
}
function setSync(t){ const el=$("#sync"); if(el) el.textContent=t; }

async function connect(){
  try{
    if(!window.claude||!window.claude.use) { setSync("Seus treinos ficam salvos neste aparelho."); return; }
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user){ setSync("Seus treinos ficam salvos neste aparelho."); return; }
    const id=await user.id(); if(!id){ setSync("Seus treinos ficam salvos neste aparelho."); return; }
    const c=db.collection("data/users/"+id);
    const timer=new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),10000));
    const snap=await Promise.race([c.get(),timer]);
    let remote={runners:null,lapM:null,days:{},u:0};
    snap.docs.forEach(d=>{
      if(!d.exists) return; const b=d.data(); if(!b||typeof b.json!=="string") return;
      try{
        const v=JSON.parse(b.json);
        if(d.id==="meta"){ remote.runners=v.runners; remote.lapM=v.lapM; remote.cd=v.cd; remote.u=v.u||0; }
        else if(d.id.startsWith("d-")) remote.days[d.id.slice(2)]=v;
      }catch(e){}
    });
    // junta nuvem + aparelho sem perder nada
    if(remote.runners){
      if(!S.runners.length || remote.u>=S.u){ S.runners=remote.runners; S.lapM=remote.lapM||400; if(typeof remote.cd==="boolean") S.cd=remote.cd; }
    }
    const allDays=new Set([...Object.keys(S.days),...Object.keys(remote.days)]);
    allDays.forEach(k=>{
      const a=S.days[k]||[], b=remote.days[k]||[]; const m=new Map();
      b.forEach(e=>m.set(e.id,e)); a.forEach(e=>m.set(e.id,e));
      const merged=[...m.values()].sort((x,y)=>x.at-y.at);
      if(merged.length!==b.length) dirty.add(k);
      S.days[k]=merged;
    });
    if(!remote.runners || S.u>remote.u) dirty.add("meta");
    col=c; saveLocal();
    setSync("Treinos salvos na sua conta — abra em outro aparelho e eles estarão lá.");
    if(!ui.runner&&S.runners[0]) ui.runner=S.runners[0].id;
    render(); flush();
  }catch(e){ setSync("Seus treinos ficam salvos neste aparelho."); }
}

/* ---------- consultas ---------- */
const runnerById=id=>S.runners.find(r=>r.id===id);
const entriesOf=(rid,k)=>{const out=[]; Object.keys(S.days).sort().forEach(d=>S.days[d].forEach(e=>{ if(e.r===rid&&(!k||e.k===k)) out.push(Object.assign({d},e)); })); return out;};
const bestOf=(rid,k)=>{let b=null; entriesOf(rid,k).forEach(e=>{ if(b===null||e.ms<b) b=e.ms; }); return b;};

function weekStartKey(){ const d=new Date(); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return dayKey(d); }
function weekStats(rid){
  const ws=weekStartKey(), today=dayKey(); let m=0; const days=new Set();
  Object.keys(S.days).forEach(d=>{ if(d>=ws&&d<=today) S.days[d].forEach(e=>{ if(e.r===rid){ m+=metersOf(e.k); days.add(d);} }); });
  return {m,days:days.size};
}
const kmTxt=m=>(m/1000).toLocaleString("pt-BR",{maximumFractionDigits:m<10000?2:1})+" km";
function goalHTML(r,mini){
  if(!r.goalKm) return "";
  const w=weekStats(r.id), pct=Math.min(100,w.m/(r.goalKm*1000)*100), done=pct>=100;
  return '<div class="bar'+(mini?" mini-bar":"")+(done?" done":"")+'" style="--c:'+r.color+'" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(pct)+'"><i style="width:'+pct.toFixed(1)+'%"></i></div>';
}
function fmt(ms,withMin){
  const cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000)%60, m=Math.floor(ms/60000);
  if(m>0||withMin) return m+":"+pad(s)+","+pad(cs);
  return s+","+pad(cs);
}
function fmtClock(ms,lapMode){
  const cs=Math.floor(ms/10)%100, s=Math.floor(ms/1000)%60, m=Math.floor(ms/60000);
  const main=(m>0||lapMode)?(m+":"+pad(s)):String(s);
  return main+'<span class="cs">,'+pad(cs)+"</span>";
}
function pace(ms,meters){ // min/km
  const perKm=ms/meters*1000; const m=Math.floor(perKm/60000), s=Math.round((perKm%60000)/1000);
  return m+":"+pad(s===60?59:s)+" /km";
}
const dateLabel=k=>{const [y,m,d]=k.split("-").map(Number); const dt=new Date(y,m-1,d);
  return dt.toLocaleDateString("pt-BR",{weekday:"short",day:"numeric",month:"short"}).replace(/\./g,"");};

/* ---------- cronômetro ---------- */
let T={running:false,t0:0,lapStart:0,laps:[],raf:0};
function now(){ return performance.now(); }

let audio=null, cdTimers=[], counting=false;
function beep(freq,dur,vol){
  try{
    if(!audio) audio=new (window.AudioContext||window.webkitAudioContext)();
    if(audio.state==="suspended") audio.resume();
    const o=audio.createOscillator(), g=audio.createGain(), t=audio.currentTime;
    o.type="square"; o.frequency.value=freq; g.gain.setValueAtTime(vol||0.25,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g).connect(audio.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function say(txt){
  try{ if(!window.speechSynthesis) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(txt); u.lang="pt-BR"; speechSynthesis.speak(u); }catch(e){}
}
function cancelCountdown(){
  cdTimers.forEach(clearTimeout); cdTimers=[]; counting=false;
  try{ window.speechSynthesis&&speechSynthesis.cancel(); }catch(e){}
  $("#countdown").classList.remove("open","go");
}
function start(){
  if(ui.group&&!ui.sel.length){ toast("Toque no nome de quem vai correr."); return; }
  if(!ui.runner){ openRunnerSheet(); return; }
  if(counting) return;
  if(!S.cd){ begin(); return; }
  counting=true; beep(1,0.01,0.001); // libera o áudio no toque
  const r=runnerById(ui.runner), ov=$("#countdown"), txt=$("#cdText");
  $("#cdWho").textContent=(groupActive()?ui.sel.map(id=>runnerById(id).name).join(", "):r.name)+" · "+(isSprint()?ui.mode+" m":"voltas");
  ov.classList.remove("go"); ov.classList.add("open");
  const at=(ms,fn)=>cdTimers.push(setTimeout(fn,ms));
  txt.textContent="Às suas marcas"; say("Às suas marcas"); beep(440,0.18);
  at(2600,()=>{ txt.textContent="Prontos"; say("Prontos"); beep(440,0.18); });
  const go=4200+Math.round(Math.random()*1200); // espera curta e imprevisível, como na pista
  at(go,()=>{ txt.textContent="Já!"; ov.classList.add("go"); beep(880,0.45,0.35); begin(); });
  at(go+700,()=>{ ov.classList.remove("open","go"); counting=false; });
}
function begin(){
  T.running=true; T.t0=now(); T.lapStart=T.t0; T.laps=[];
  if(groupActive()) beginGroup(T.t0); else clearGroup();
  tick(); renderControls(); renderTicker();
}
function stop(){
  const t=now(); T.running=false; cancelAnimationFrame(T.raf);
  if(isSprint()){
    const ms=Math.round(t-T.t0);
    if(ms<1000){ toast("Tempo muito curto, não foi salvo."); resetClock(); renderControls(); return; }
    const r=runnerById(ui.runner); const prevBest=bestOf(ui.runner,ui.mode);
    const e=addEntry(ui.runner,ui.mode,ms);
    $("#clock").innerHTML=fmtClock(ms,false);
    const pb=prevBest===null||ms<prevBest;
    $("#sub").innerHTML=pb?'<span class="pb">Novo recorde de '+esc(r.name)+"!</span>":"Recorde: "+fmt(prevBest)+" s";
    toast(ui.mode+" m de "+r.name+" salvo: "+fmt(ms)+" s",()=>removeEntry(e));
  }else{
    const ms=Math.round(t-T.lapStart);
    if(ms>=5000){ lapNow(t); }
    toast(T.laps.length? T.laps.length+(T.laps.length>1?" voltas salvas":" volta salva"):"Nenhuma volta marcada.");
  }
  renderControls(); renderTicker(); renderToday(); renderGoal(); renderMode();
}
function lapNow(t){
  t=t||now(); const ms=Math.round(t-T.lapStart);
  if(ms<5000){ toast("Volta muito curta, ignorada."); return; }
  const e=addEntry(ui.runner,"volta",ms); T.laps.push(e); T.lapStart=t;
  renderTicker(); renderToday(); renderGoal();
  if(navigator.vibrate) try{navigator.vibrate(40);}catch(err){}
}
function resetClock(){ $("#clock").innerHTML=fmtClock(0,ui.mode==="volta"); renderMode(); renderSub(); }

function tick(){
  if(!T.running) return;
  const t=now(), el=t-T.t0;
  if(G&&!G.fin){ tickGroup(t); T.raf=requestAnimationFrame(tick); return; }
  if(isSprint()){
    $("#clock").innerHTML=fmtClock(el,false);
    const ref=bestOf(ui.runner,ui.mode)||REF[ui.mode]; const s0=sprintStart(); moveDotAt(s0+(140-s0)*Math.min(el/ref,1));
  }else{
    $("#clock").innerHTML=fmtClock(t-T.lapStart,true);
    const ref=bestOf(ui.runner,"volta")||120000; moveDot(((t-T.lapStart)/ref)%1);
    $("#sub").textContent="Volta "+(T.laps.length+1)+" · total "+fmt(el,true);
  }
  T.raf=requestAnimationFrame(tick);
}
let trkLen=0;
function len(){ if(!trkLen) trkLen=$("#trk").getTotalLength(); return trkLen; }
// posição de largada (em unidades do desenho); a chegada fica sempre no fim da reta (140)
function sprintStart(){ const arc=Math.PI*65; return ui.mode==="50"?70:ui.mode==="200"?-arc:0; }
function moveDotAt(pos){
  const L=len(); const pt=$("#trk").getPointAtLength(((pos%L)+L)%L); const d=$("#runnerDot");
  d.setAttribute("cx",pt.x.toFixed(1)); d.setAttribute("cy",pt.y.toFixed(1));
}
function moveDot(p){ moveDotAt(len()*p); }

/* ---------- largada em grupo ---------- */
let G=null;
const groupActive=()=>ui.group&&ui.sel.length>1;
const txtOn=c=>c==="#F2C200"?"#1A1A1A":"#fff";
function beginGroup(t0){
  G={k:ui.mode,t0,fin:false,rs:ui.sel.map(id=>({id,lapStart:t0,laps:0,best:null,ms:null,done:false,pb:false}))};
  $("#runnerDot").style.display="none";
  $("#gdots").innerHTML=G.rs.map(g=>'<circle data-gd="'+g.id+'" r="7" fill="'+runnerById(g.id).color+'" stroke="#fff" stroke-width="2.5"/>').join("");
}
function clearGroup(){ G=null; const gd=$("#gdots"); if(gd) gd.innerHTML=""; $("#runnerDot").style.display=""; }
function groupTap(id){
  if(!G||G.fin) return; const g=G.rs.find(x=>x.id===id); if(!g||g.done) return;
  const t=now(), r=runnerById(id);
  if(G.k!=="volta"){
    const ms=Math.round(t-G.t0); if(ms<1000) return;
    const prev=bestOf(id,G.k); addEntry(id,G.k,ms); g.ms=ms; g.done=true; g.pb=prev===null||ms<prev;
    toast(r.name+": "+fmt(ms)+" s"+(g.pb?" · novo recorde!":""));
  }else{
    const ms=Math.round(t-g.lapStart); if(ms<5000){ toast("Volta muito curta, ignorada."); return; }
    addEntry(id,"volta",ms); g.laps++; g.lapStart=t; g.best=g.best===null?ms:Math.min(g.best,ms);
    toast(r.name+": volta "+g.laps+" em "+fmt(ms,true));
  }
  if(navigator.vibrate) try{navigator.vibrate(40);}catch(e){}
  renderToday(); renderGoal();
  if(G.rs.every(x=>x.done)) finishGroup(); else { renderControls(); renderTicker(); }
}
function groupDone(id){
  const g=G&&G.rs.find(x=>x.id===id); if(!g) return; g.done=true;
  if(G.rs.every(x=>x.done)) finishGroup(); else { renderControls(); renderTicker(); }
}
function finishGroup(){
  if(!G) return;
  T.running=false; cancelAnimationFrame(T.raf); G.fin=true; G.rs.forEach(g=>g.done=true);
  const n=G.k==="volta"?G.rs.reduce((a,g)=>a+g.laps,0):G.rs.filter(g=>g.ms!==null).length;
  toast("Treino em grupo salvo: "+n+(G.k==="volta"?(n===1?" volta":" voltas"):(n===1?" tempo":" tempos"))+".");
  renderControls(); renderTicker(); renderSub();
}
function renderGroupControls(c){
  c.className="gctl";
  c.innerHTML=G.rs.map(g=>{
    const r=runnerById(g.id), fg=txtOn(r.color);
    if(G.k!=="volta"){
      return g.done?'<button class="gbtn done" style="--c:'+r.color+'" disabled><span>'+esc(r.name)+'<small>chegou</small></span><span class="gt">'+(g.ms!==null?fmt(g.ms)+" s":"–")+'</span></button>'
        :'<button class="gbtn" style="--c:'+r.color+';color:'+fg+'" data-g="'+g.id+'"><span>'+esc(r.name)+'<small>toque na chegada</small></span><span class="gt">Chegou!</span></button>';
    }
    if(g.done) return '<button class="gbtn done" style="--c:'+r.color+'" disabled><span>'+esc(r.name)+'<small>terminou · '+g.laps+(g.laps===1?" volta":" voltas")+'</small></span><span class="gt">✓</span></button>';
    return '<div class="grow"><button class="gbtn" style="--c:'+r.color+';color:'+fg+'" data-g="'+g.id+'"><span>'+esc(r.name)+'<small>marcar volta '+(g.laps+1)+'</small></span><span class="gt" data-gt="'+g.id+'">0:00</span></button><button class="gfin" data-gf="'+g.id+'">Terminou</button></div>';
  }).join("")+'<button class="btn ghost" id="gEnd">Encerrar todos</button>';
  c.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>groupTap(b.dataset.g));
  c.querySelectorAll("[data-gf]").forEach(b=>b.onclick=()=>groupDone(b.dataset.gf));
  $("#gEnd").onclick=finishGroup;
  $("#manualBtn").classList.add("hidden");
}
function tickGroup(t){
  const el=t-G.t0; $("#clock").innerHTML=fmtClock(el,G.k==="volta");
  const arrived=G.rs.filter(g=>g.done).length;
  $("#sub").textContent=G.k==="volta"?"Tempo total · cada um marca a própria volta":arrived+" de "+G.rs.length+" chegaram";
  const L=len();
  G.rs.forEach(g=>{
    let pos;
    if(G.k!=="volta"){ const s0=sprintStart(), ref=bestOf(g.id,G.k)||REF[G.k]; pos=g.done?140:s0+(140-s0)*Math.min(el/ref,1); }
    else{
      const ref=bestOf(g.id,"volta")||120000; pos=L*(((t-g.lapStart)/ref)%1);
      const s=document.querySelector('[data-gt="'+g.id+'"]'); if(s&&!g.done) s.textContent=fmt(t-g.lapStart,true).replace(/,\d\d$/,"");
    }
    const dot=document.querySelector('[data-gd="'+g.id+'"]');
    if(dot){ const pt=$("#trk").getPointAtLength(((pos%L)+L)%L); dot.setAttribute("cx",pt.x.toFixed(1)); dot.setAttribute("cy",pt.y.toFixed(1)); }
  });
}

/* ---------- dados ---------- */
function addEntry(r,k,ms){
  const d=dayKey(); const e={id:uid(),r,k,ms,at:Date.now()};
  const rr=runnerById(r), before=weekStats(r).m;
  (S.days[d]=S.days[d]||[]).push(e); markDirty(d);
  if(rr&&rr.goalKm&&before<rr.goalKm*1000&&before+metersOf(k)>=rr.goalKm*1000){
    setTimeout(()=>{ toast(rr.name+" cumpriu a meta da semana! 🏅"); beep(660,0.15); setTimeout(()=>beep(990,0.3),170); },2700);
  }
  return Object.assign({d},e);
}
function removeEntry(e){
  const list=S.days[e.d]; if(!list) return;
  const i=list.findIndex(x=>x.id===e.id); if(i<0) return;
  list.splice(i,1); if(!list.length) delete S.days[e.d];
  markDirty(e.d); render();
}

/* ---------- render ---------- */
function chipHTML(r,pressed){
  const ini=esc((r.name.trim()[0]||"?").toUpperCase());
  return '<button class="chip" style="--c:'+r.color+'" data-id="'+r.id+'" aria-pressed="'+pressed+'"><span class="dot"'+(r.color==="#F2C200"?' style="color:#1A1A1A"':"")+'>'+ini+"</span>"+esc(r.name)+"</button>";
}
function renderRunners(){
  const box=$("#runners");
  ui.sel=ui.sel.filter(id=>runnerById(id));
  const pressed=r=>ui.group?ui.sel.includes(r.id):r.id===ui.runner;
  box.innerHTML=(S.runners.length>1?'<button class="chip grp" id="grpChip" aria-pressed="'+ui.group+'">👥 Juntos</button>':"")+S.runners.map(r=>chipHTML(r,pressed(r))).join("")+'<button class="chip add" id="addChip">+ Pessoa</button>';
  box.querySelectorAll(".chip[data-id]").forEach(b=>b.onclick=()=>{
    if(T.running||counting){ toast("Pare o cronômetro antes de trocar de pessoa."); return; }
    const id=b.dataset.id;
    if(ui.group){ ui.sel=ui.sel.includes(id)?ui.sel.filter(x=>x!==id):ui.sel.concat(id); if(ui.sel.length) ui.runner=ui.sel[0]; clearGroup(); }
    else ui.runner=id;
    render();
  });
  const gc=$("#grpChip");
  if(gc) gc.onclick=()=>{
    if(T.running||counting){ toast("Pare o cronômetro antes."); return; }
    ui.group=!ui.group; ui.sel=ui.group&&ui.runner?[ui.runner]:[]; clearGroup();
    if(ui.group) toast("Toque no nome de cada pessoa que vai largar junto.");
    render();
  };
  $("#addChip").onclick=openRunnerSheet;
  const hb=$("#hRunners");
  hb.innerHTML=S.runners.map(r=>chipHTML(r,r.id===ui.hRunner)).join("");
  hb.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{ ui.hRunner=b.dataset.id; renderHistory(); renderRunners(); });
}
function renderMode(){
  $("#mSprint").setAttribute("aria-pressed",isSprint()); $("#mlap").setAttribute("aria-pressed",!isSprint());
  $("#dists").classList.toggle("hidden",!isSprint());
  $("#dists").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.d===ui.sprint));
  const hl=$("#straight"), sl=$("#startLine");
  if(isSprint()){
    hl.style.display="";
    hl.setAttribute("d",ui.mode==="50"?"M 160,150 H 230":ui.mode==="200"?"M 90,20 A 65 65 0 0 0 90,150 H 230":"M 90,150 H 230");
    hl.setAttribute("fill","none");

    sl.style.display="";
    if(!T.running) moveDotAt(sprintStart());
  }else{ hl.style.display="none"; sl.style.display="none"; if(!T.running) moveDot(0); }
  $("#trackLabel").textContent=isSprint()?ui.mode+" m":S.lapM+" m";
}
function renderGoal(){
  const box=$("#goal"), r=runnerById(ui.runner);

  }else{
    const left=r.goalKm*1000-w.m;
    box.innerHTML='<div class="goal"><div class="top"><span class="big">'+kmTxt(w.m)+' <span class="m">de '+kmTxt(r.goalKm*1000)+' · '+esc(r.name)+'</span></span><button class="linkish" id="goalSet">Alterar</button></div>'+goalHTML(r)+
      '<div class="m" style="margin-top:6px">'+(left<=0?"Meta da semana cumprida! 🏅":"Faltam "+kmTxt(left)+" · "+w.days+(w.days===1?" dia":" dias")+" de treino nesta semana")+"</div></div>";
  }

}
function renderSub(){

function renderControls(){

function renderTicker(){
  const t=$("#ticker");
  if(G){
    t.innerHTML=G.rs.map(g=>{ const r=runnerById(g.id); if(!r) return "";
      const v=G.k==="volta"?(g.laps+(g.laps===1?" volta":" voltas")+(g.best!==null?" · melhor "+fmt(g.best,true):"")):(g.ms!==null?fmt(g.ms)+" s":(G.fin?"–":"…"));
      return '<span class="num'+(g.pb?" best":"")+'" style="border-color:'+r.color+'">'+esc(r.name)+" "+v+"</span>"; }).join("");
    return;
  }
  if(ui.mode!=="volta"||!T.laps.length){ t.innerHTML=""; return; }
  const best=Math.min(...T.laps.map(l=>l.ms));
  t.innerHTML=T.laps.map((l,i)=>'<span class="num'+(l.ms===best&&T.laps.length>1?" best":"")+'">'+(i+1)+"ª "+fmt(l.ms,true)+"</span>").join("");
}
function renderToday(){
  const box=$("#todayList"); const list=S.days[dayKey()]||[];
  if(!list.length){ box.innerHTML='<div class="card"><div class="empty">Nenhum tiro ou volta hoje ainda. Escolha quem vai correr e toque em “Largar”.</div></div>'; return; }
  const by={}; list.forEach(e=>{(by[e.r]=by[e.r]||[]).push(e);});
  let html="";
  S.runners.filter(r=>by[r.id]).forEach(r=>{
    const es=by[r.id]; const bestK={}; ["50","100","200","volta"].forEach(k=>bestK[k]=bestOf(r.id,k));
    const dist=es.reduce((a,e)=>a+metersOf(e.k),0);
    html+='<div class="card person" style="--c:'+r.color+'"><div class="person-head"><span class="dot" style="--c:'+r.color+'"></span><strong>'+esc(r.name)+'</strong><span class="m num">'+(dist>=1000?(dist/1000).toLocaleString("pt-BR",{maximumFractionDigits:2})+" km":dist+" m")+"</span></div>";
    es.slice().sort((a,b)=>b.at-a.at).forEach(e=>{
      const isPB=e.ms===bestK[e.k];
      const label=kLabel(e.k);
      const idx=es.filter(x=>x.k===e.k).indexOf(e)+1;
      const hr=new Date(e.at).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
      html+='<div class="row"><div class="main"><div class="t num">'+fmt(e.ms,e.k==="volta")+(e.k!=="volta"?" s":"")+(isPB?'<span class="tag pb">Recorde</span>':"")+'</div><div class="m">'+label+" "+idx+" · "+hr+(e.k==="volta"?" · "+pace(e.ms,S.lapM):"")+'</div></div><button class="x" aria-label="Apagar" data-del="'+e.id+'">×</button></div>';
    });
    html+="</div>";
  });
  box.innerHTML=html;
  box.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const e=list.find(x=>x.id===b.dataset.del); if(!e) return; const copy=Object.assign({d:dayKey()},e);
    removeEntry(copy);
    toast("Registro apagado.",()=>{ (S.days[copy.d]=S.days[copy.d]||[]).push(e); S.days[copy.d].sort((a,b)=>a.at-b.at); markDirty(copy.d); render(); });
  });
}

function renderHistory(){
  if(!ui.hRunner||!runnerById(ui.hRunner)) ui.hRunner=ui.runner||(S.runners[0]&&S.runners[0].id);
  $("#hSeg").querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.h===ui.hMode));
  const rid=ui.hRunner, k=ui.hMode, isLap=k==="volta";
  if(!rid){ $("#stats").innerHTML=""; $("#chart").innerHTML='<div class="empty">Adicione a família na aba Família.</div>'; $("#days").innerHTML=""; return; }
  const es=entriesOf(rid,k);
  const byDay={}; es.forEach(e=>{(byDay[e.d]=byDay[e.d]||[]).push(e);});
  const dayKeys=Object.keys(byDay).sort();
  const best=es.length?Math.min(...es.map(e=>e.ms)):null;
  const avg=es.length?es.reduce((a,e)=>a+e.ms,0)/es.length:null;
  const dist=es.length*metersOf(k);
  $("#stats").innerHTML=[
    [best!==null?fmt(best,isLap)+(isLap?"":" s"):"–","Melhor "+(isLap?"volta":"tiro")],
    [avg!==null?fmt(avg,isLap)+(isLap?"":" s"):"–","Média geral"],
    [es.length,isLap?"Voltas no total":"Tiros no total"],
    [dist>=1000?(dist/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" km":dist+" m",dayKeys.length+(dayKeys.length===1?" dia":" dias")+" de treino"]
  ].map(s=>'<div class="stat"><div class="v">'+s[0]+'</div><div class="l">'+s[1]+"</div></div>").join("");

  // gráfico: melhor tempo de cada dia (quanto mais baixo, melhor)
  const pts=dayKeys.slice(-20).map(d=>({d,v:Math.min(...byDay[d].map(e=>e.ms))}));
  const ch=$("#chart");
  if(pts.length<2){ ch.innerHTML='<div class="empty">Treine em pelo menos dois dias para ver a evolução aqui.</div>'; }
  else{
    const W=340,H=170,pl=44,pr=12,pt=12,pb=26;
    let mn=Math.min(...pts.map(p=>p.v)), mx=Math.max(...pts.map(p=>p.v)); if(mx-mn<200){mx+=100;mn-=100;}
    const x=i=>pl+(W-pl-pr)*i/(pts.length-1), y=v=>pt+(H-pt-pb)*(v-mn)/(mx-mn);
    const line=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+","+y(p.v).toFixed(1)).join(" ");
    const bi=pts.findIndex(p=>p.v===Math.min(...pts.map(q=>q.v)));
    const ticks=[mn,(mn+mx)/2,mx];
    ch.innerHTML='<div class="cap">Melhor tempo de cada dia — quanto mais baixo, mais rápido</div><svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Evolução do melhor tempo por dia">'+
      ticks.map(v=>'<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Barlow Condensed, Arial Narrow, sans-serif">'+fmt(v,isLap)+"</text>").join("")+
      '<path d="'+line+'" fill="none" stroke="var(--tartan)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>'+
      pts.map((p,i)=>'<circle cx="'+x(i)+'" cy="'+y(p.v)+'" r="'+(i===bi?5:3)+'" fill="'+(i===bi?"var(--gold)":"var(--tartan)")+'"/>').join("")+
      '<text x="'+pl+'" y="'+(H-6)+'" font-size="11" fill="var(--muted)">'+dateLabel(pts[0].d)+'</text><text x="'+(W-pr)+'" y="'+(H-6)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+dateLabel(pts[pts.length-1].d)+"</text></svg>";
  }

  const dbox=$("#days");
  if(!dayKeys.length){ dbox.innerHTML='<div class="card"><div class="empty">Ainda sem '+(isLap?"voltas":"tiros de "+k+" m")+" registrados.</div></div>"; return; }
  dbox.innerHTML='<div class="card">'+dayKeys.slice().reverse().map(d=>{
    const l=byDay[d], b=Math.min(...l.map(e=>e.ms)), a=l.reduce((s,e)=>s+e.ms,0)/l.length;
    return '<div class="row"><div class="main"><div class="t num">'+fmt(b,isLap)+(isLap?"":" s")+(b===best?'<span class="tag pb">Recorde</span>':"")+'</div><div class="m">'+dateLabel(d)+" · "+l.length+(isLap?(l.length>1?" voltas":" volta"):(l.length>1?" tiros":" tiro"))+" · média "+fmt(a,isLap)+"</div></div></div>";
  }).join("")+"</div>";
}

/* ---------- folhas (sheets) ---------- */
function openSheet(html){ $("#sheet").innerHTML=html; $("#scrim").classList.add("open"); const f=$("#sheet").querySelector("input"); if(f) setTimeout(()=>f.focus(),60); }
function closeSheet(){ $("#scrim").classList.remove("open"); }
$("#scrim").addEventListener("click",e=>{ if(e.target.id==="scrim") closeSheet(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });

function openRunnerSheet(editId){
  const r=typeof editId==="string"?runnerById(editId):null;
  const used=S.runners.map(x=>x.color);
  let color=r?r.color:(COLORS.find(c=>!used.includes(c))||COLORS[S.runners.length%COLORS.length]);
  openSheet('<h3>'+(r?"Editar "+esc(r.name):"Quem vai correr?")+'</h3>'+
    '<div class="field"><label for="rName">Nome</label><input class="input" id="rName" maxlength="24" placeholder="Ex.: Ana, Pai, Lucas" value="'+(r?esc(r.name):"")+'"></div>'+
    '<div class="field"><label>Cor</label><div class="swatches" id="sws">'+COLORS.map(c=>'<button class="sw" style="--c:'+c+'" data-c="'+c+'" aria-label="Cor" aria-pressed="'+(c===color)+'"></button>').join("")+"</div></div>"+
    '<div class="field"><label for="rGoal">Meta semanal em km (deixe vazio para não ter meta)</label><input class="input num" id="rGoal" type="number" min="0" max="200" step="0.5" inputmode="decimal" placeholder="Ex.: 3" value="'+(r&&r.goalKm?r.goalKm:"")+'"></div>'+
    '<div class="controls'+(r?"":" one")+'" style="margin-top:18px">'+(r?'<button class="btn ghost" id="rDel">Remover</button>':"")+'<button class="btn go" id="rSave">Salvar</button></div>');
  $("#sws").querySelectorAll(".sw").forEach(b=>b.onclick=()=>{ color=b.dataset.c; $("#sws").querySelectorAll(".sw").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  const save=()=>{
    const name=$("#rName").value.trim(); if(!name){ $("#rName").focus(); return; }
    const g=parseFloat(String($("#rGoal").value).replace(",","."))||0; const goalKm=g>0?Math.round(g*10)/10:0;
    if(r){ r.name=name; r.color=color; if(goalKm) r.goalKm=goalKm; else delete r.goalKm; }
    else{ const n={id:uid(),name,color}; if(goalKm) n.goalKm=goalKm; S.runners.push(n); ui.runner=n.id; if(!ui.hRunner) ui.hRunner=n.id; }
    markDirty("meta"); closeSheet(); render();
  };
  $("#rSave").onclick=save; $("#rName").onkeydown=e=>{ if(e.key==="Enter") save(); };
  if(r) $("#rDel").onclick=()=>{
    const n=entriesOf(r.id).length;
    if(n&&!confirm("Remover "+r.name+" e apagar "+n+" registros dessa pessoa?")) return;
    Object.keys(S.days).forEach(d=>{ const before=S.days[d].length; S.days[d]=S.days[d].filter(e=>e.r!==r.id); if(S.days[d].length!==before){ if(!S.days[d].length) delete S.days[d]; dirty.add(d);} });
    S.runners=S.runners.filter(x=>x.id!==r.id);
    if(ui.runner===r.id) ui.runner=S.runners[0]?S.runners[0].id:null;
    if(ui.hRunner===r.id) ui.hRunner=ui.runner;
    markDirty("meta"); closeSheet(); render();
  };
}

function openManualSheet(){
  if(!S.runners.length){ openRunnerSheet(); return; }
  openSheet('<h3>Lançar tempo à mão</h3>'+
    '<div class="field"><label for="mr">Quem correu</label><select class="input" id="mr">'+S.runners.map(r=>'<option value="'+r.id+'"'+(r.id===ui.runner?" selected":"")+">"+esc(r.name)+"</option>").join("")+"</select></div>"+
    '<div class="field"><label for="mk">Tipo</label><select class="input" id="mk">'+["50","100","200"].map(d=>'<option value="'+d+'"'+(ui.mode===d?" selected":"")+">Tiro de "+d+" m</option>").join("")+'<option value="volta"'+(ui.mode==="volta"?" selected":"")+">Volta ("+S.lapM+" m)</option></select></div>"+
    '<div class="field"><label>Tempo</label><div class="inline"><input class="input num" id="mm" type="number" min="0" inputmode="numeric" placeholder="min"><input class="input num" id="ms" type="number" min="0" max="59" step="0.01" inputmode="decimal" placeholder="seg (ex.: 15,42)"></div></div>'+
    '<div class="field"><label for="md">Data</label><input class="input" id="md" type="date" value="'+dayKey()+'" max="'+dayKey()+'"></div>'+
    '<div class="controls one" style="margin-top:18px"><button class="btn go" id="mSave">Salvar tempo</button></div>');
  $("#mSave").onclick=()=>{
    const m=parseFloat($("#mm").value||"0")||0, s=parseFloat(String($("#ms").value).replace(",","."))||0;
    const ms=Math.round((m*60+s)*1000); if(ms<1000){ $("#ms").focus(); return; }
    const d=$("#md").value||dayKey(); const [y,mo,dd]=d.split("-").map(Number);
    const e={id:uid(),r:$("#mr").value,k:$("#mk").value,ms,at:new Date(y,mo-1,dd,12).getTime()};
    if(d===dayKey()) e.at=Date.now();
    (S.days[d]=S.days[d]||[]).push(e); S.days[d].sort((a,b)=>a.at-b.at);
    markDirty(d); closeSheet(); render(); toast("Tempo salvo.");
  };
}

/* ---------- toast ---------- */
let toastTimer=0;
function toast(msg,undo){
  $("#toastMsg").textContent=msg; const b=$("#toastUndo");
  b.classList.toggle("hidden",!undo); b.onclick=()=>{ if(undo) undo(); $("#toast").classList.remove("show"); };
  $("#toast").classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>$("#toast").classList.remove("show"),undo?5000:2600);
}

document.addEventListener("keydown",e=>{

/* ---------- backup ---------- */
$("#bkExp").onclick=()=>{
  try{
    const blob=new Blob([JSON.stringify({app:"pista-familia",v:1,data:S})],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="pista-familia-"+dayKey()+".json";
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500);
    toast("Backup baixado.");
  }catch(e){ toast("Não foi possível baixar o backup."); }
};
$("#bkImp").onclick=()=>$("#bkFile").click();
$("#bkFile").onchange=async e=>{
  const f=e.target.files[0]; e.target.value=""; if(!f) return;
  try{
    const o=JSON.parse(await f.text()); const d=o&&o.data?o.data:o;
    if(!d||!d.days||!Array.isArray(d.runners)) throw new Error("formato");
    let n=0;
    d.runners.forEach(r=>{ if(r&&r.id&&r.name&&!runnerById(r.id)) S.runners.push(r); });
    Object.keys(d.days).forEach(k=>{
      const cur=S.days[k]||[], ids=new Set(cur.map(x=>x.id));
      (d.days[k]||[]).forEach(x=>{ if(x&&x.id&&!ids.has(x.id)){ cur.push(x); n++; } });
      if(cur.length){ cur.sort((a,b)=>a.at-b.at); S.days[k]=cur; dirty.add(k); }
    });
    markDirty("meta"); render(); toast(n+(n===1?" registro importado.":" registros importados."));
  }catch(err){ toast("Arquivo de backup inválido."); }
};

const THEMES=[["auto","Automático","linear-gradient(135deg,#F3F5F3 50%,#16181A 50%)","#FFFFFF","#13201A"],["light","Claro","#EDF1EE","#FFFFFF","#13201A"],["cream","Creme","#F3EDE1","#FBF7EF","#2A241C"],["gray","Cinza suave","#D3D9DF","#F1F3F5","#1D232A"],["dark","Escuro grafite","#141517","#2C2F33","#ECEDEE"]];
const SIZES=[["1","Normal",15],["1.12","Maior",19],["1.25","Bem maior",23]];
const ACCENTS=[["","Vermelho pista","#B03925"],["#2F5FA8","Azul","#2F5FA8"],["#2E7A55","Verde","#2E7A55"],["#7A4BA8","Roxo","#7A4BA8"],["#D9731A","Laranja","#D9731A"],["#D0457E","Rosa","#D0457E"]];
const PK="pista-familia-aparencia";
let AP={theme:"auto",size:"1",acc:""};
try{ Object.assign(AP,JSON.parse(localStorage.getItem(PK)||"{}")); }catch(e){}
function applyAP(save){
  const de=document.documentElement;
  if(AP.theme==="auto") de.removeAttribute("data-theme"); else de.setAttribute("data-theme",AP.theme);
  document.body.style.zoom=AP.size==="1"?"":AP.size;
  if(AP.acc) de.style.setProperty("--tartan",AP.acc); else de.style.removeProperty("--tartan");
  if(save) try{ localStorage.setItem(PK,JSON.stringify(AP)); }catch(e){}
  renderAP();
}
function renderAP(){
  $("#themeList").innerHTML=THEMES.map(t=>'<button class="th" data-t="'+t[0]+'" aria-pressed="'+(AP.theme===t[0])+'"><span class="pv" style="background:'+t[2]+';--pvs:'+t[3]+';--pvi:'+t[4]+'"><span>Aa</span></span>'+t[1]+(AP.theme===t[0]?'<span class="ck">✓</span>':"")+"</button>").join("");
  $("#sizeList").innerHTML=SIZES.map(z=>'<button class="sz" data-z="'+z[0]+'" aria-pressed="'+(AP.size===z[0])+'"><b style="font-size:'+z[2]+'px">Aa</b>'+z[1]+"</button>").join("");
  $("#accList").innerHTML=ACCENTS.map(a=>'<button class="sw" style="--c:'+a[2]+'" data-a="'+a[0]+'" aria-label="'+a[1]+'" title="'+a[1]+'" aria-pressed="'+(AP.acc===a[0])+'"></button>').join("");
  $("#themeList").querySelectorAll(".th").forEach(b=>b.onclick=()=>{ AP.theme=b.dataset.t; applyAP(true); });
  $("#sizeList").querySelectorAll(".sz").forEach(b=>b.onclick=()=>{ AP.size=b.dataset.z; applyAP(true); });
  $("#accList").querySelectorAll(".sw").forEach(b=>b.onclick=()=>{ AP.acc=b.dataset.a; applyAP(true); });
}
function togglePal(open){
  const m=$("#palMenu"), b=$("#palBtn"); const o=open===undefined?m.classList.contains("hidden"):open;
  m.classList.toggle("hidden",!o); b.setAttribute("aria-expanded",o);
}
$("#palBtn").onclick=e=>{ e.stopPropagation(); togglePal(); };
document.addEventListener("click",e=>{ if(!$("#palMenu").classList.contains("hidden")&&!e.target.closest("#palMenu")) togglePal(false); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") togglePal(false); });
applyAP(false);

/* ---------- início ---------- */
loadLocal();
$("#clock").innerHTML=fmtClock(0,false);
render();
connect();
})();
if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
